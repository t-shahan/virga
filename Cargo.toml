[package]
name = "weather_tui"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
const_format = "0.2.36"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = { version = "3.3.0", features = ["json"] }

[[bin]]
name = "weather"
path = "src/main.rs"

[profile.release]
# LTO and a single codegen unit let the optimiser work across crate boundaries;
# strip drops debug symbols. Costs noticeably longer release builds.
lto = true
codegen-units = 1
strip = true
