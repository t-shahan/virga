[package]
name = "virga-tui"
version = "0.6.1"
edition = "2024"
description = "A responsive terminal weather app with an adaptive hourly weathergram, powered by Open-Meteo"
license = "MIT OR Apache-2.0"
repository = "https://github.com/t-shahan/virga"
readme = "README.md"
# An allow-list rather than an `exclude`, because an exclude list drifts: the
# old one named `docs/superpowers/` and nothing else, so the crate shipped the
# agent config, the workflows, the install script and the release scripts,
# none of which build anything. A new top-level directory now stays out of
# the tarball until someone says otherwise. `tests/` is here because the
# unit tests `include_str!` the fixtures; `cargo package` verifies only a
# plain build, so nothing would notice them missing until someone ran
# `cargo test` on the published source. The manifest, the lock file of a
# binary crate, and the file the `readme` key names ship whether or not this
# list says so; they are named for the reader, not for Cargo.
include = [
    "src/",
    "tests/",
    "Cargo.toml",
    "Cargo.lock",
    "CHANGELOG.md",
    "README.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
]
# Not the edition floor of 1.85: ratatui 0.30.2 and ratatui-core 0.1.2 both
# declare 1.88.0, and a dependency graph's minimum is not the same thing as
# edition support. 1.89 is this crate's own ask: `File::lock`, which
# serializes concurrent state saves, stabilized there.
rust-version = "1.89"
keywords = ["weather", "tui", "terminal", "cli", "forecast"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
directories = "6.0.0"
tempfile = "3.27.0"
ureq = { version = "3.3.0", features = ["json"] }

[[bin]]
name = "virga"
path = "src/main.rs"

[profile.release]
# LTO and a single codegen unit let the optimiser work across crate boundaries;
# strip drops debug symbols. Costs noticeably longer release builds.
lto = true
codegen-units = 1
strip = true
